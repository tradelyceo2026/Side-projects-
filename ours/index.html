<title>Ours</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F1F2ED; --surface:#FFFFFF; --sunk:#E7E9E2; --ink:#15171C; --muted:#5B616C; --line:#D9DCD3;
  --a:#2447D6; --a-soft:#DDE3FB; --b:#D98E00; --b-soft:#FBEBCB;
  --good:#1D7F52; --good-soft:#D7EFE2; --warn:#B8561A; --warn-soft:#F8E1D0; --bad:#B8323A;
  --shadow:0 1px 2px rgba(21,23,28,.06),0 8px 24px -12px rgba(21,23,28,.18);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F1115; --surface:#181B21; --sunk:#12151A; --ink:#ECEDE8; --muted:#9BA1AB; --line:#2A2E36;
    --a:#7B93FF; --a-soft:#1E2748; --b:#F2B33D; --b-soft:#3A2C10;
    --good:#4CC28A; --good-soft:#12301F; --warn:#F08A4B; --warn-soft:#3A2113; --bad:#FF6B72;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F1115; --surface:#181B21; --sunk:#12151A; --ink:#ECEDE8; --muted:#9BA1AB; --line:#2A2E36;
  --a:#7B93FF; --a-soft:#1E2748; --b:#F2B33D; --b-soft:#3A2C10;
  --good:#4CC28A; --good-soft:#12301F; --warn:#F08A4B; --warn-soft:#3A2113; --bad:#FF6B72;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-block:14px 96px}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(30px,5.4vw,52px);font-weight:800}
h2{font-size:clamp(22px,3vw,28px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.grid2{display:grid;gap:14px;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.lift{box-shadow:var(--shadow)}
.sunk{background:var(--sunk);border-radius:12px;padding:12px 14px}
section.view{display:flex;flex-direction:column;gap:18px}
.lede{max-width:64ch;color:var(--muted);font-size:15.5px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em}
.brand svg{width:40px;height:26px}
.brand small{font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px;white-space:nowrap}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tabs a .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px}

/* partners */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.dot.a{background:var(--a)} .dot.b{background:var(--b)}
.dot.s{background:repeating-linear-gradient(135deg,var(--a) 0 3px,var(--b) 3px 6px)}
.ta{color:var(--a)} .tb{color:var(--b)}
.braid{background:repeating-linear-gradient(135deg,var(--a) 0 7px,var(--b) 7px 14px)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.a{background:var(--a-soft);color:var(--a)}
.chip.b{background:var(--b-soft);color:var(--b)}

/* controls */
button{font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--ink);color:var(--paper);font:600 14px var(--body);padding:9px 15px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.small{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.a{background:var(--a);color:#fff} .btn.b{background:var(--b);color:#1b1300}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;font-size:13px}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{font:13px/1.4 var(--mono);min-height:110px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ink)}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));align-items:end}

/* bars */
.bar{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ink)}
.bar>i.over{background:var(--warn)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad);border-radius:1px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.split>i{display:block;height:100%}
.split>i.a{background:var(--a)} .split>i.b{background:var(--b)}

/* home hero */
.hero{display:grid;gap:18px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:end}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--b-soft) 62%)}
.stat{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* tx list */
.tx{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .s{font-size:12.5px;color:var(--muted)}
.tx .amt{font-family:var(--mono);font-weight:600;text-align:right}
.tx.private .t{color:var(--muted);font-style:italic}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 13px var(--display);background:var(--sunk);color:var(--muted)}
.ico.shared{background:repeating-linear-gradient(135deg,var(--a-soft) 0 5px,var(--b-soft) 5px 10px);color:var(--ink)}
.ico.a{background:var(--a-soft);color:var(--a)} .ico.b{background:var(--b-soft);color:var(--b)}

/* heads-up */
.heads{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--warn-soft);color:var(--ink)}
.heads b{color:var(--warn)}
.heads .glyph{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--warn);color:#fff;font-weight:800;font-family:var(--display)}

/* fairness */
.modes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.mode{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.mode:hover{border-color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode strong{font-family:var(--display);font-size:17px}
.mode span{font-size:13px;color:var(--muted)}
.mode .rec{align-self:flex-start;order:-1}
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th,.ledger td{padding:10px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.ledger th:first-child,.ledger td:first-child{text-align:left;white-space:normal}
.ledger thead th{border-top:0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ledger tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.ledger tr.hl td{background:var(--sunk)}
.scroll{overflow-x:auto}
.quote{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:700;line-height:1.2;text-wrap:balance}

/* chamber */
.bid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px;border-radius:12px;border:1px dashed var(--line);font-size:13px;color:var(--muted);text-align:center;padding:10px}
.seal.done{border-style:solid}
.seal.done.a{background:var(--a-soft);border-color:transparent;color:var(--a)}
.seal.done.b{background:var(--b-soft);border-color:transparent;color:var(--b)}
.wax{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--display);color:#fff}
.wax.a{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--a) 70%,#fff),var(--a) 60%)}
.wax.b{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--b) 70%,#fff),var(--b) 60%);color:#1b1300}
.cool{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.cool i{display:block;height:100%;background:var(--muted)}
.tickets{display:flex;gap:10px;flex-wrap:wrap}
.ticket{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px dashed currentColor;font-weight:600;font-size:13px}
.ticket.used{opacity:.4;text-decoration:line-through}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:800px}
.rcard{border-radius:14px;padding:18px;text-align:center;animation:flip .7s cubic-bezier(.2,.8,.2,1) both}
.rcard.a{background:var(--a-soft);color:var(--a)} .rcard.b{background:var(--b-soft);color:var(--b);animation-delay:.18s}
.rcard .big{font:800 56px/1 var(--display)}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}

/* dreams */
.braidsvg{width:100%;height:44px;display:block}
.dream h3{font-size:20px}

/* storm */
.runway{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:10px 14px;align-items:center}
@media (max-width:560px){.runway{grid-template-columns:1fr auto}.runway .track{grid-column:1/-1;order:3}}
.track{height:22px;background:var(--sunk);border-radius:6px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.toggle input{margin-top:3px;accent-color:var(--ink)}

/* money date */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.steps i.on{background:var(--ink)}
.timer{font:600 38px/1 var(--mono);font-variant-numeric:tabular-nums}
.love{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:14px}

/* modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--warn-soft);border-radius:10px;font-size:13.5px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="var(--a)" stroke-width="4"/><circle cx="27" cy="13" r="10" fill="none" stroke="var(--b)" stroke-width="4"/><path d="M20 5.5 A10 10 0 0 1 23 13" fill="none" stroke="var(--a)" stroke-width="4"/></svg>
      <span>Ours <small id="brand-sub"></small></span>
    </div>
    <div class="row">
      <span class="kicker">Viewing as</span>
      <div class="seg" id="viewer" role="group" aria-label="Who is looking"></div>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';
const KEY = 'ours.v1';
const DAY = 864e5;
const $ = s => document.querySelector(s);
const sum = (arr, f = x => x) => arr.reduce((t, x) => t + (+f(x) || 0), 0);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, dec = 0) => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseD = s => new Date(s + 'T00:00:00');
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const monthName = d => d.toLocaleString('en-US', {month: 'long', year: 'numeric'});
const shortDate = d => d.toLocaleString('en-US', {month: 'short', day: 'numeric'});
const monYr = d => d.toLocaleString('en-US', {month: 'short', year: 'numeric'});
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const addMonths = (d, m) => { const x = new Date(d); x.setMonth(x.getMonth() + m); return x; };
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TASKS = {Cooking: 22, Cleaning: 25, Laundry: 20, Errands: 20, 'Household admin': 32, 'Caregiving': 21};

/* ---------- sample household ---------- */
function sample() {
  const t = today(), m = t.getMonth(), y = t.getFullYear(), max = t.getDate();
  const on = day => ymd(new Date(y, m, Math.min(day, max)));
  const ago = n => ymd(new Date(t.getTime() - n * DAY));
  const tx = [
    [1,'Groceries',142.18,'Costco run','shared','a'],
    [2,'Transport',48,'Gas','shared','b'],
    [3,'Dining',64.5,'Thai place on 5th','shared','a'],
    [4,'Home',39.99,'Shower curtain + hooks','shared','b'],
    [6,'Groceries',88.4,"Trader Joe's",'shared','b'],
    [7,'Fun',42,'Movie night','shared','a'],
    [9,'Dining',38,'Brunch','shared','b'],
    [10,'Groceries',121.7,'Weekly shop','shared','a'],
    [12,'Personal',64,'Vinyl record','a','a'],
    [13,'Dining',91.2,"Dev's birthday dinner",'shared','a'],
    [14,'Transport',52,'Gas','shared','a'],
    [15,'Groceries',96.35,'Weekly shop','shared','b'],
    [17,'Personal',38,'Pottery drop-in class','b','b'],
    [18,'Fun',28,'Mini golf','shared','b'],
    [19,'Dining',52.8,'Tacos + drinks','shared','a'],
    [20,'Groceries',74.2,'Farmers market','shared','a'],
    [21,'Home',22.5,'Light bulbs','shared','a'],
  ].map(([d,cat,amount,note,bucket,paidBy]) => ({id: uid(), date: on(d), cat, amount, note, bucket, paidBy}));
  const labor = [
    ['b','Cooking',14],['b','Cleaning',8],['b','Household admin',6],['b','Caregiving',6],['b','Laundry',4],
    ['a','Cooking',5],['a','Errands',6],['a','Cleaning',3],['a','Household admin',2],
  ].map(([who,task,hours],i) => ({id: uid(), who, task, hours, date: on(2 + i * 2)}));
  return {
    v: 1, sample: true, viewer: 'both',
    people: {a: {name: 'Sam', income: 5800, minimum: 350}, b: {name: 'Riley', income: 3400, minimum: 280}},
    anniversary: ymd(new Date(y - 6, t.getMonth(), t.getDate() + 11)),
    emergency: 14500,
    fairness: {mode: 'breathing', custom: 60, labor: 50},
    bills: [
      {id: uid(), name: 'Rent', amount: 2100, essential: true},
      {id: uid(), name: 'Utilities', amount: 180, essential: true},
      {id: uid(), name: 'Internet', amount: 70, essential: true},
      {id: uid(), name: 'Insurance', amount: 240, essential: true},
      {id: uid(), name: 'Car payment', amount: 380, essential: true},
      {id: uid(), name: 'Streaming', amount: 45, essential: false},
    ],
    budgets: [
      {cat: 'Groceries', amount: 700, essential: true},
      {cat: 'Dining', amount: 280, essential: false},
      {cat: 'Home', amount: 120, essential: false},
      {cat: 'Transport', amount: 200, essential: true},
      {cat: 'Fun', amount: 180, essential: false},
    ],
    allowance: {a: 400, b: 400},
    rates: {...TASKS},
    tx, labor,
    tripwires: [
      {id: uid(), owner: 'b', cat: 'Dining', limit: 220, why: 'Eating out creeps up on us and I end up anxious about savings.'},
      {id: uid(), owner: 'a', cat: 'Fun', limit: 150, why: 'I want fun money to feel planned, not random.'},
    ],
    chamber: [
      {id: uid(), name: 'Espresso machine', price: 749, created: Date.now() - 3 * DAY, bids: {a: {score: 8, max: 800}, b: null}, outcome: null},
      {id: uid(), name: 'Road bike', price: 1850, created: Date.now() - 20 * 36e5, bids: {a: null, b: null}, outcome: null},
      {id: uid(), name: 'Standing desk', price: 420, created: Date.now() - 19 * DAY, bids: {a: {score: 4, max: 300}, b: {score: 3, max: 250}}, outcome: 'let-go'},
    ],
    tickets: {a: {q: quarter(), used: false}, b: {q: quarter(), used: false}},
    letGo: 420,
    dreams: [
      {id: uid(), name: 'Lisbon, just the two of us', target: 6000, saved: 2350, ca: 250, cb: 150},
      {id: uid(), name: 'House down payment', target: 60000, saved: 18400, ca: 600, cb: 300},

function blank() {
  const s = sample();
  return {...s, sample: false, tx: [], labor: [], chamber: [], dreams: [], tripwires: [], letGo: 0,
    dates: {day: 0, history: [], love: []}, people: {a: {name: 'Partner A', income: 4000, minimum: 0}, b: {name: 'Partner B', income: 4000, minimum: 0}},
    emergency: 0, anniversary: ymd(today())};
}
function quarter(d = new Date()) { return d.getFullYear() + 'Q' + (Math.floor(d.getMonth() / 3) + 1); }

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || S.v !== 1) S = sample();
for (const k of ['a','b']) if (S.tickets[k].q !== quarter()) S.tickets[k] = {q: quarter(), used: false};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- derived numbers ---------- */
const P = k => esc(S.people[k].name);
const other = k => k === 'a' ? 'b' : 'a';
const monthTx = () => { const m = ymd(today()).slice(0, 7); return S.tx.filter(t => t.date.slice(0, 7) === m); };
const sharedTx = () => monthTx().filter(t => t.bucket === 'shared');
const fixedTotal = () => sum(S.bills, b => b.amount);
const budgetTotal = () => sum(S.budgets, b => b.amount);
const sharedPlan = () => fixedTotal() + budgetTotal();
const spentIn = cat => sum(sharedTx().filter(t => t.cat === cat), t => t.amount);
const laborValue = k => { const m = ymd(today()).slice(0, 7); return sum(S.labor.filter(l => l.who === k && l.date.slice(0, 7) === m), l => l.hours * (S.rates[l.task] ?? 20)); };
const laborHours = k => { const m = ymd(today()).slice(0, 7); return sum(S.labor.filter(l => l.who === k && l.date.slice(0, 7) === m), l => l.hours); };

function modeBase(mode, pot) {
  const ia = S.people.a.income, ib = S.people.b.income;
  if (mode === 'half') return pot / 2;
  if (mode === 'proportional') return ia + ib ? pot * ia / (ia + ib) : pot / 2;
  if (mode === 'breathing') return (pot + ia - ib) / 2;
  return pot * S.fairness.custom / 100;
}
function fair(mode = S.fairness.mode, weight = S.fairness.labor) {
  const pot = sharedPlan(), La = laborValue('a'), Lb = laborValue('b');
  const base = clamp(modeBase(mode, pot), 0, pot);
  const credit = (La - Lb) / 2 * weight / 100;
  const ca = clamp(base - credit, 0, pot), cb = pot - ca;
  return {pot, La, Lb, credit, base: {a: base, b: pot - base}, cash: {a: ca, b: cb},
    keep: {a: S.people.a.income - ca, b: S.people.b.income - cb}, pct: {a: pot ? ca / pot : .5, b: pot ? cb / pot : .5}};
}
function settle() {
  const f = fair(); let paidA = 0, paidB = 0;
  for (const t of monthTx()) {
    if (t.bucket === 'shared') { if (t.paidBy === 'a') paidA += t.amount; else paidB += t.amount; }
    if (t.bucket === 'settle') { if (t.paidBy === 'a') { paidA += t.amount; paidB -= t.amount; } else { paidB += t.amount; paidA -= t.amount; } }
  }
  const total = sum(sharedTx(), t => t.amount);
  const diff = paidA - total * f.pct.a;
  if (Math.abs(diff) < 1) return {even: true, total};
  return diff > 0 ? {from: 'b', to: 'a', amount: diff, total} : {from: 'a', to: 'b', amount: -diff, total};
}
const allowanceLeft = k => S.allowance[k] - sum(monthTx().filter(t => t.bucket === k), t => t.amount);
function crossed() { return S.tripwires.filter(w => spentIn(w.cat) > w.limit).map(w => ({...w, spent: spentIn(w.cat)})); }
function coolingLeft(c) { return Math.max(0, 48 * 36e5 - (Date.now() - c.created)); }
const openChamber = () => S.chamber.filter(c => !c.outcome);

function annivDate(n) { const a = parseD(S.anniversary); return new Date(a.getFullYear() + n, a.getMonth(), a.getDate()); }
function annivN(d) { const a = parseD(S.anniversary); let n = d.getFullYear() - a.getFullYear(); if (d < new Date(d.getFullYear(), a.getMonth(), a.getDate())) n--; return n; }
function nextAnniv() { const n = annivN(today()) + 1; return {n, date: annivDate(n), days: Math.round((annivDate(n) - today()) / DAY)}; }

function weekIdx(d) { return Math.floor(Math.round((d.getTime() - new Date(2024, 0, 7).getTime()) / DAY) / 7); } // Sunday-anchored weeks, DST-safe
function streak() {
  const weeks = new Set(S.dates.history.map(s => weekIdx(parseD(s))));
  let w = weekIdx(today()); if (!weeks.has(w)) w--;
  let n = 0; while (weeks.has(w)) { n++; w--; }
  return n;
}
function nextDate() {
  const t = today(), done = S.dates.history.some(s => weekIdx(parseD(s)) === weekIdx(t));
  let d = (S.dates.day - t.getDay() + 7) % 7;
  if (d === 0 && done) d = 7;
  return {days: d, date: new Date(t.getTime() + d * DAY), doneThisWeek: done};
}

  if (avg >= 7 && gap <= 3 && c.price <= cap) return ['good', 'You both want it, at this price.', 'Buy it and enjoy it. No guilt, you decided this together.'];
  if (avg >= 7 && c.price > cap) return ['warn', 'Yes to the thing. No to the price.', `The lower of your two limits is ${money(cap)}. Hunt for a deal under that, or a used one.`];
  if (gap >= 4) return ['warn', 'You want this very differently.', `A ${Math.max(a.score, b.score)} and a ${Math.min(a.score, b.score)}. Talk about what it means to each of you on your money date. A golden ticket can settle it.`];
  if (avg < 5) return ['', 'Let it go.', `Neither of you is that into it. ${money(c.price)} stays yours.`];
  return ['', 'Lukewarm.', 'Give it 30 more days. If you still think about it, put it back in.'];
}

const clock = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- Dreams ---------- */
function dreamEta(d) {
  const rem = Math.max(0, d.target - d.saved), mo = d.ca + d.cb;
  if (!rem) return {text: 'Fully funded. Go do it'};
  if (!mo) return {text: 'Set a monthly amount to see when you get there'};
  const months = Math.ceil(rem / mo), eta = addMonths(today(), months), n = annivN(eta);
  const after = (eta - annivDate(n)) / DAY, before = (annivDate(n + 1) - eta) / DAY;
  let when;
  if (n < 1 && before > 45) when = `before your 1st anniversary`;
  else if (before <= 45) when = `just before your ${ord(n + 1)} anniversary`;
  else if (after <= 45) when = `right around your ${ord(n)} anniversary`;
  else when = `between your ${ord(n)} and ${ord(n + 1)} anniversaries`;
  let nudge = '';
  const target = annivDate(n), monthsTo = (target - today()) / (30.44 * DAY);
  if (n >= 1 && monthsTo >= 2 && after > 45) {
    const need = rem / Math.floor(monthsTo) - mo;
    if (need > 0) nudge = `Want it by your ${ord(n)} anniversary (${monYr(target)})? That's ${money(Math.ceil(need))} more a month between you.`;
  }
  return {text: `On track for ${monYr(eta)}, ${when}`, nudge, months};
}
function braid(d) {
  const p = clamp(d.saved / (d.target || 1), 0, 1), W = 600, H = 44, id = 'c' + d.id;
  const path = phase => { let s = ''; for (let x = 0; x <= W; x += 6) { const y = H / 2 + 12 * Math.sin(x / 34 + phase); s += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1); } return s; };
  return `<svg class="braidsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="${Math.round(p * 100)}% funded">
    <defs><clipPath id="${id}"><rect x="0" y="0" width="${p * W}" height="${H}"/></clipPath></defs>
    <path d="${path(0)}" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>
    <path d="${path(Math.PI)}" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>
    <g clip-path="url(#${id})"><path d="${path(0)}" fill="none" stroke="var(--a)" stroke-width="6" stroke-linecap="round"/><path d="${path(Math.PI)}" fill="none" stroke="var(--b)" stroke-width="6" stroke-linecap="round"/></g>
  </svg>`;
}
function vDreams() {
  const na = nextAnniv();
  return `
  <div class="stack"><span class="kicker">Dreams</span><h2>Goals measured in your years together, not in months.</h2>
  <p class="lede">"Fourteen months" is abstract. "Just before your 8th anniversary" is a promise. Each dream is two strands, one for each of you, braiding toward the finish.</p></div>
  <div class="row between"><span class="muted">Together since ${parseD(S.anniversary).toLocaleString('en-US', {month: 'long', day: 'numeric', year: 'numeric'})} · ${ord(na.n)} anniversary in ${na.days} days</span><button class="btn" data-act="adddream">New dream</button></div>

    ${Object.keys(S.rates).map((t, i) => `<label class="f" for="rate-${i}">${esc(t)} $/h <input id="rate-${i}" type="number" min="0" value="${S.rates[t]}" data-rate="${esc(t)}"></label>`).join('')}
  </div></div>
  <div class="card stack"><h3>Your data</h3>
    <p class="muted">Everything lives in this browser only. Copy a backup to move it to another device or keep it safe.</p>
    <div class="row"><button class="btn ghost" data-act="copyback">Copy backup</button><button class="btn ghost" data-act="showrestore">Restore from backup</button><button class="btn danger" data-act="askreset" data-k="blank">Start blank</button><button class="btn danger" data-act="askreset" data-k="sample">Reload example</button></div>
    <div id="data-slot"></div>
  </div>`;
}

/* ---------- modal + toast ---------- */
let onClose = null;
function modal(html, cb) {
  onClose = cb || null;
  $('#modal').innerHTML = `<div class="scrim" data-act="closemodal"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const first = $('#modal').querySelector('input,select,button:not([disabled])'); first && first.focus();
}
function closeModal() { $('#modal').innerHTML = ''; if (onClose) { const f = onClose; onClose = null; f(); } }
let toastT;
function toast(msg) { const t = $('#toast'); t.className = 'toast'; t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- actions ---------- */
function setPath(path, val) { const ks = path.split('.'); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
const A = {
  viewer: el => { S.viewer = el.dataset.k; render(); },
  mode: el => { S.fairness.mode = el.dataset.k; render(); },
  closemodal: (el, e) => { if (e.target === el) closeModal(); },
  settle: () => { const st = settle(); if (st.even) return; S.tx.push({id: uid(), date: ymd(today()), bucket: 'settle', paidBy: st.from, amount: +st.amount.toFixed(2), cat: 'Settle', note: ''}); render(); toast(`Logged: ${S.people[st.from].name} paid ${money(st.amount, 2)}`); },
  deltx: el => { S.tx = S.tx.filter(t => t.id !== el.dataset.id); render(); toast('Removed'); },
  addtx: () => {
    const who = S.viewer === 'both' ? 'a' : S.viewer;
    modal(`<h2>Add spending</h2><div class="formgrid">
      <label class="f" for="tx-amt">Amount <input id="tx-amt" type="number" min="0" step="0.01" placeholder="0.00"></label>
      <label class="f" for="tx-note">What was it <input id="tx-note" type="text" placeholder="Weekly shop"></label>
      <label class="f" for="tx-bucket">Whose money <select id="tx-bucket"><option value="shared">Shared</option><option value="a">${P('a')}'s own</option><option value="b">${P('b')}'s own</option></select></label>
      <label class="f" for="tx-cat">Category <select id="tx-cat">${S.budgets.map(b => `<option>${esc(b.cat)}</option>`).join('')}</select></label>
      <label class="f" for="tx-paid">Paid by <select id="tx-paid"><option value="a" ${who === 'a' ? 'selected' : ''}>${P('a')}</option><option value="b" ${who === 'b' ? 'selected' : ''}>${P('b')}</option></select></label>
    </div><p class="muted" style="font-size:13px">Own money is private: your partner sees the amount leave your no-questions balance, never what it was.</p>
    <p id="tx-err" style="color:var(--bad)" hidden>Enter an amount above zero.</p>
    <div class="row"><button class="btn" data-act="savetx">Add it</button><button class="btn ghost" data-act="cancel">Cancel</button></div>`);
  },
  savetx: () => {
    const amount = +$('#tx-amt').value; if (!(amount > 0)) { $('#tx-err').hidden = false; return; }
    const bucket = $('#tx-bucket').value;
    S.tx.push({id: uid(), date: ymd(today()), amount, note: $('#tx-note').value.trim(), bucket, cat: bucket === 'shared' ? $('#tx-cat').value : 'Personal', paidBy: bucket === 'shared' ? $('#tx-paid').value : bucket});
    closeModal(); render();
    toast(bucket === 'shared' ? 'Added to shared spending' : 'Added privately');
  },
  cancel: () => closeModal(),
  addbid: () => modal(`<h2>Put something in the chamber</h2><p class="muted">It cools off for 48 hours. Then each of you bids in private.</p>
    <div class="formgrid"><label class="f" for="c-name">What is it <input id="c-name" type="text" placeholder="Espresso machine"></label>
    <label class="f" for="c-price">Price <input id="c-price" type="number" min="0" step="1"></label></div>
    <p id="c-err" style="color:var(--bad)" hidden>Give it a name and a price.</p>
    <div class="row"><button class="btn" data-act="savebid">Start the cool-off</button><button class="btn ghost" data-act="cancel">Cancel</button></div>`),
  savebid: () => { const name = $('#c-name').value.trim(), price = +$('#c-price').value; if (!name || !(price > 0)) { $('#c-err').hidden = false; return; }
    S.chamber.push({id: uid(), name, price, created: Date.now(), bids: {a: null, b: null}, outcome: null}); closeModal(); render(); toast('In the chamber. 48 hours on the clock.'); },
  bid: el => { const c = S.chamber.find(x => x.id === el.dataset.id), k = el.dataset.k, o = other(k);
    modal(`<span class="kicker">Sealed bid · ${esc(c.name)} · ${money(c.price)}</span><h2>Hand the phone to ${P(k)}.</h2><p class="muted">${P(o)}, look away. Your bid is next.</p>
      <div><button class="btn ${k}" data-act="bidopen" data-id="${c.id}" data-k="${k}">I'm ${P(k)}. Show me</button></div>`); },
  bidopen: el => { const c = S.chamber.find(x => x.id === el.dataset.id), k = el.dataset.k;
    modal(`<span class="kicker">${P(k)}'s sealed bid · ${esc(c.name)}</span><h2>How much do you want it?</h2>
      <label class="f" for="b-score"><span class="row between"><span>1 = meh · 5 = nice to have · 10 = I think about it daily</span><b class="num" id="b-score-v" style="font-size:22px;color:var(--ink)">5</b></span>
      <input id="b-score" type="range" min="1" max="10" value="5" data-live="score"></label>
      <label class="f" for="b-max">The most I'd pay <input id="b-max" type="number" min="0" value="${c.price}"></label>
      <div class="row"><button class="btn ${k}" data-act="seal" data-id="${c.id}" data-k="${k}">Seal it</button><button class="btn ghost" data-act="cancel">Cancel</button></div>`); },
  seal: el => { const c = S.chamber.find(x => x.id === el.dataset.id), k = el.dataset.k;
    c.bids[k] = {score: +$('#b-score').value, max: +$('#b-max').value || 0}; save();
    modal(`<div class="stack" style="align-items:center;text-align:center;padding:10px"><div class="wax ${k} pop" style="width:72px;height:72px;font-size:28px">${esc(S.people[k].name[0] || '?')}</div><h2>Sealed.</h2><p class="muted">${P(other(k))} can't see it. Hand the phone back.</p><button class="btn" data-act="cancel">Done</button></div>`);
    render(); },
  skipcool: el => { const c = S.chamber.find(x => x.id === el.dataset.id); c.created = Date.now() - 48 * 36e5; render(); },
  reveal: el => { const c = S.chamber.find(x => x.id === el.dataset.id), [tone, head, body] = verdict(c);
    const hi = c.bids.a.score >= c.bids.b.score ? 'a' : 'b';
    modal(`<span class="kicker">Reveal · ${esc(c.name)} · ${money(c.price)}</span>
      <div class="reveal">${['a','b'].map(k => `<div class="rcard ${k}"><div class="kicker" style="color:inherit">${P(k)}</div><div class="big">${c.bids[k].score}</div><div style="font-size:13px">would pay up to <b class="num">${money(c.bids[k].max)}</b></div></div>`).join('')}</div>
      <div class="sunk"><h3 style="color:var(--${tone || 'ink'})">${head}</h3><p style="margin-top:6px">${body}</p></div>
      <div class="row"><button class="btn" data-act="decide" data-id="${c.id}" data-k="bought">We're buying it</button>
      <button class="btn ghost" data-act="decide" data-id="${c.id}" data-k="let-go">Let it go</button>
      ${!S.tickets[hi].used ? `<button class="btn ghost" data-act="decide" data-id="${c.id}" data-k="ticket" data-w="${hi}">★ ${P(hi)} uses a golden ticket</button>` : ''}</div>`); },
  decide: el => { const c = S.chamber.find(x => x.id === el.dataset.id), k = el.dataset.k; c.outcome = k;
    if (k === 'let-go') S.letGo += c.price;
    if (k === 'ticket') S.tickets[el.dataset.w].used = true;
    closeModal(); render(); toast(k === 'let-go' ? `${money(c.price)} stays in your pocket` : k === 'ticket' ? 'Golden ticket used. Enjoy it.' : 'Decided together'); },
  startdate: () => openDate(),
  datenext: () => { dateState.i++; drawDate(); },
  dateprev: () => { dateState.i--; drawDate(); },
  datefinish: () => { const a = $('#love-a').value.trim(), b = $('#love-b').value.trim(), d = ymd(today());
    if (!S.dates.history.includes(d)) S.dates.history.push(d);
    if (a || b) S.dates.love.unshift({date: d, a, b});
    closeModal(); render(); toast(`Date done in ${clock(Date.now() - dateState.start)}. ${streak()}-week streak.`); },
  adddream: () => dreamForm(null),
  editdream: el => dreamForm(S.dreams.find(d => d.id === el.dataset.id)),
  savedream: el => { const name = $('#dr-name').value.trim(), target = +$('#dr-target').value; if (!name || !(target > 0)) { $('#dr-err').hidden = false; return; }
    const vals = {name, target, saved: +$('#dr-saved').value || 0, ca: +$('#dr-ca').value || 0, cb: +$('#dr-cb').value || 0};
    const d = S.dreams.find(x => x.id === el.dataset.id); if (d) Object.assign(d, vals); else S.dreams.push({id: uid(), ...vals});
    closeModal(); render(); toast('Saved'); },
  deldream: el => { S.dreams = S.dreams.filter(d => d.id !== el.dataset.id); closeModal(); render(); toast('Dream removed'); },
  fund: el => { const d = S.dreams.find(x => x.id === el.dataset.id);
    modal(`<h2>Add to ${esc(d.name)}</h2><div class="formgrid"><label class="f" for="fu-amt">Amount <input id="fu-amt" type="number" min="0" step="1" value="50"></label></div>
      <div class="row"><button class="btn" data-act="savefund" data-id="${d.id}">Add it</button><button class="btn ghost" data-act="cancel">Cancel</button></div>`); },
  savefund: el => { const d = S.dreams.find(x => x.id === el.dataset.id), v = +$('#fu-amt').value || 0; d.saved += v; closeModal(); render(); toast(`${money(v)} braided in`); },
  addwork: () => { const hours = +$('#w-hours').value; if (!(hours > 0)) { toast('Enter hours above zero'); return; }
    S.labor.push({id: uid(), who: $('#w-who').value, task: $('#w-task').value, hours, date: ymd(today())}); render(); toast('Logged. It counts.'); },
  delwork: el => { S.labor = S.labor.filter(l => l.id !== el.dataset.id); render(); },
  storm: el => { storm[el.dataset.k] = el.checked; render(); },
  addbill: () => { S.bills.push({id: uid(), name: 'New bill', amount: 0, essential: true}); render(); },
  delbill: el => { S.bills.splice(+el.dataset.i, 1); render(); },
  addbudget: () => { S.budgets.push({cat: 'New category', amount: 0, essential: false}); render(); },
  addwire: () => { const limit = +$('#tw-lim').value; if (!(limit >= 0)) return;
    S.tripwires.push({id: uid(), owner: S.viewer, cat: $('#tw-cat').value, limit, why: $('#tw-why').value.trim()}); render(); toast('Line set. Only you can see the number.'); },
  delwire: el => { S.tripwires = S.tripwires.filter(w => w.id !== el.dataset.id); render(); },
  copyback: () => { const txt = JSON.stringify(S);
    const fallback = () => { $('#data-slot').innerHTML = `<label class="f" for="backup-out">Select all and copy<textarea id="backup-out" readonly>${esc(txt)}</textarea></label>`; $('#backup-out').select(); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Backup copied'), fallback); } catch (e) { fallback(); } },
  showrestore: () => { $('#data-slot').innerHTML = `<label class="f" for="backup-in">Paste a backup<textarea id="backup-in"></textarea></label><p id="backup-err" style="color:var(--bad)" hidden>That doesn't look like an Ours backup. Paste the whole text you copied.</p><div><button class="btn" data-act="restore">Restore</button></div>`; },
  restore: () => { try { const d = JSON.parse($('#backup-in').value); if (d.v !== 1 || !d.people) throw 0; S = d; render(); toast('Restored'); } catch (e) { $('#backup-err').hidden = false; } },
  askreset: el => { const k = el.dataset.k; $('#data-slot').innerHTML = `<div class="confirm"><span>${k === 'blank' ? 'Erase everything and start blank?' : 'Replace everything with the example household?'} This can't be undone.</span><button class="btn small danger" data-act="doreset" data-k="${k}">Yes, ${k === 'blank' ? 'erase' : 'replace'}</button><button class="btn small ghost" data-act="noreset">Keep my data</button></div>`; },
  noreset: () => { $('#data-slot').innerHTML = ''; },
  doreset: el => { S = el.dataset.k === 'blank' ? blank() : sample(); render(); toast(el.dataset.k === 'blank' ? 'Fresh start' : 'Example loaded'); },
};
function dreamForm(d) {
  modal(`<h2>${d ? 'Edit dream' : 'A new dream'}</h2><div class="formgrid">
    <label class="f" for="dr-name" style="grid-column:1/-1">What is it <input id="dr-name" type="text" value="${esc(d?.name || '')}" placeholder="Our first trip to Japan"></label>
    <label class="f" for="dr-target">Costs <input id="dr-target" type="number" min="0" value="${d?.target || ''}"></label>
    <label class="f" for="dr-saved">Saved so far <input id="dr-saved" type="number" min="0" value="${d?.saved || 0}"></label>
    <label class="f" for="dr-ca">${P('a')} / month <input id="dr-ca" type="number" min="0" value="${d?.ca || 0}"></label>
    <label class="f" for="dr-cb">${P('b')} / month <input id="dr-cb" type="number" min="0" value="${d?.cb || 0}"></label></div>
    <p id="dr-err" style="color:var(--bad)" hidden>Give it a name and a cost.</p>
    <div class="row between"><div class="row"><button class="btn" data-act="savedream" data-id="${d?.id || ''}">Save</button><button class="btn ghost" data-act="cancel">Cancel</button></div>
    ${d ? `<button class="btn small danger" data-act="deldream" data-id="${d.id}">Remove</button>` : ''}</div>`);
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { location.hash = go.dataset.go; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.type === 'checkbox') return; // handled on change
  const f = A[el.dataset.act]; if (f) f(el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'storm') return A.storm(el);
  if (el.dataset.rate) { S.rates[el.dataset.rate] = +el.value || 0; return render(); }
  if (el.dataset.set) {
    let v = el.dataset.bool !== undefined ? el.checked : el.dataset.num !== undefined ? (+el.value || 0) : el.value;
    if (el.dataset.set === 'anniversary' && !v) return;
    setPath(el.dataset.set, v); S.sample = false; render();
  }
});
document.addEventListener('input', e => {
  const el = e.target, live = el.dataset.live; if (!live) return;
  if (live === 'labor') { S.fairness.labor = +el.value; $('#f-labor-v').textContent = el.value + '%'; fairOut(); renderShell(); save(); }
  if (live === 'custom') { S.fairness.custom = +el.value; $('#f-custom-v').textContent = el.value + '%'; fairOut(); save(); }
  if (live === 'score') $('#b-score-v').textContent = el.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) closeModal(); });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.some(x => x[0] === t)) { tab = t; render(); window.scrollTo({top: 0}); } });
render();
})();
</script>
